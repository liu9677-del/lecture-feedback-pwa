<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>演講評論助手</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="style.css" />
<meta name="theme-color" content="#2b5797" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>
  <h1>🎙 演講評論助手</h1>
  <p>錄完一場立刻可以錄下一場，分析會在背景排隊處理，完成後顯示在下方。</p>

  <button id="recordBtn">開始錄音</button>
  <button id="uploadBtn">或上傳音檔</button>
  <input type="file" id="fileInput" accept="audio/*" style="display:none" />

  <div id="status"></div>
  <div id="reports"></div>

  <div class="settings">
    <label>Gemini API Key</label>
    <input type="password" id="geminiKey" placeholder="貼上您的 Gemini API Key" />
    <label>Google Drive 授權</label>
    <button id="driveAuthBtn" style="background:#eee;color:#222;">連接 Google Drive</button>
    <div id="driveStatus" style="font-size:12px;color:#888;"></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
